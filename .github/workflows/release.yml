name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  tests:
    name: Release tests - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            testbench: '10.*'
          - laravel: '13'
            testbench: '11.*'

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, fileinfo, gd, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer update "orchestra/testbench:${{ matrix.testbench }}" \
            --with-all-dependencies \
            --prefer-dist \
            --no-interaction

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Verify installed Laravel version
        run: composer show laravel/framework

      - name: Run tests
        run: composer test

  publish:
    name: Create GitHub Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected format: v1.0.0"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
